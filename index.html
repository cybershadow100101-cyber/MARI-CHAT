<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>Zylo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#16211d;--mute:#6a7a73;--g1:#0f5c4d;--g2:#1fa37f;--them:#fff;--line:#dde5e0;--red:#e5484d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1513;--card:#17211e;--ink:#eaf2ee;--mute:#8ea39a;--them:#1f2d29;--line:#263631}}
:root[data-theme=dark]{--bg:#0e1513;--card:#17211e;--ink:#eaf2ee;--mute:#8ea39a;--them:#1f2d29;--line:#263631}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.hide{display:none!important}button{border:0;font:inherit;cursor:pointer}
input{width:100%;padding:13px 16px;margin:6px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:1rem;outline:none}
.btn{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:600;margin-top:6px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon{background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
header{display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:2}
header strong{flex:1;min-width:0;font-size:1.1rem}header small{display:block;font-weight:400;opacity:.85;font-size:.75rem}
.body{flex:1;overflow-y:auto;padding:8px 0}
.center{justify-content:center;align-items:center;padding:20px;text-align:center;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff}
.sheet{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;width:min(100%,380px);text-align:left}
.sheet h3,.sheetb h3,.card h3{margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:6px 10px;border-radius:16px;background:var(--card);cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.row .t{flex:1;min-width:0}.row b{display:block}.row small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{background:var(--g2);color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:700}
.av{width:46px;height:46px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;background-size:cover;background-position:center}
.mute{color:var(--mute);font-size:.88rem}.err{color:var(--red);font-size:.88rem;min-height:1.2em}
.tabs{display:flex;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{flex:1;background:none;color:var(--mute);padding:10px 2px 8px;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--g2);font-weight:700}.tabs button.on svg{background:rgba(31,163,127,.16);border-radius:14px;padding:4px;width:44px;height:28px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.m{max-width:80%;padding:8px 12px 6px;border-radius:18px 18px 18px 4px;background:var(--them);box-shadow:0 2px 6px rgba(0,0,0,.12);overflow-wrap:anywhere;position:relative}
.m.me{align-self:flex-end;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.m a{color:inherit}.m img{display:block;max-width:100%;max-height:280px;border-radius:12px}
.m .who{font-size:.72rem;font-weight:700;opacity:.8;margin-bottom:2px}
.meta{font-size:.68rem;opacity:.7;text-align:right;margin-top:3px}.meta.read{color:#9fe8ff;opacity:1}.dim{font-style:italic;opacity:.75}
.react{position:absolute;right:8px;bottom:-12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 5px;font-size:.85rem}.m:has(.react){margin-bottom:12px}
.sys{align-self:center;background:rgba(15,25,22,.55);color:#fff;font-size:.76rem;padding:4px 12px;border-radius:12px;text-align:center}
.quote{border-left:3px solid var(--g2);background:rgba(127,127,127,.15);padding:4px 8px;border-radius:8px;margin-bottom:5px;font-size:.82rem}
.voice{display:flex;align-items:center;gap:8px;min-width:210px}.play{width:36px;height:36px;border-radius:50%;background:rgba(127,127,127,.25);color:inherit;display:grid;place-items:center;flex:none}
.bars{display:flex;align-items:center;gap:2px;flex:1;height:26px}.bars span{width:3px;background:currentColor;opacity:.35;border-radius:2px}.bars span.on{opacity:1}
.note{display:block;font-size:.66rem;opacity:.75}.bomb{color:#ffd2c9;font-weight:700;font-size:.8rem;margin-top:4px}
.pbtn{display:block;width:100%;text-align:left;background:rgba(127,127,127,.18);color:inherit;border-radius:10px;padding:8px 10px;margin:4px 0;position:relative;overflow:hidden}
.pbtn i{position:absolute;left:0;top:0;bottom:0;background:rgba(31,163,127,.4)}.pbtn span{position:relative}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px}
#chips button{white-space:nowrap;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:.85rem}
#rpl,#sq{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--card);font-size:.82rem}#rpl div{flex:1;border-left:3px solid var(--g2);padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sq input{margin:0}#rpl button,#sq button{background:none;color:var(--mute)}
form{display:flex;gap:6px;align-items:center;padding:10px}
form input{margin:0;flex:1;border:0;border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.rb{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;flex:none}
.rb.rec{background:var(--red);animation:p 1s infinite}@keyframes p{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.rb.rec,.fx{animation:none}}
.plain{background:none;color:var(--mute);width:40px;height:40px;display:grid;place-items:center;flex:none}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card.vid{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}.card.vid .mute{color:rgba(255,255,255,.85)}.card.vid .btn{background:#fff;color:var(--g1)}
.xpbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2))}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheetb{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0));max-height:85%;overflow-y:auto}
.opt{display:block;width:100%;text-align:left;background:none;color:var(--ink);padding:14px 6px;border-bottom:1px solid var(--line);font-size:1rem}.opt.danger{color:var(--red)}.card .opt:last-child{border-bottom:0}
.emo{display:flex;justify-content:space-around;padding:6px 0 10px}.emo button{background:none;font-size:1.7rem}
.fx{position:fixed;top:-30px;pointer-events:none;z-index:40;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:50;max-width:90%;font-size:.9rem}
#lock{z-index:60;align-items:center;justify-content:center;background:var(--bg)}
.tabs button{position:relative}.tabs .dot{position:absolute;top:2px;left:55%}
#call{display:flex}#call.hide{display:none!important}#incn2 svg,#kend svg{transform:rotate(135deg)}
.m.stk{background:none;box-shadow:none;color:var(--ink);font-size:3.2rem;line-height:1.15;padding:2px 6px}.m.stk.me{background:none}.m.stk .meta{font-size:.68rem}
</style>
</head>
<body>
<div id="login" class="screen center">
  <img src="icon-192.png" width="84" height="84" alt="Zylo logo" style="border-radius:22px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)">
  <h1 style="margin:0;font-size:2rem">Zylo</h1><div style="opacity:.9;margin-top:2px">More than messages</div>
  <p style="opacity:.9;margin:6px 0 16px">Private chat. No phone number or SIM needed.</p>
  <div class="sheet">
    <input id="em" type="email" placeholder="Email" autocomplete="email" autocapitalize="none">
    <input id="pw" type="password" placeholder="Password (6 or more characters)" autocomplete="current-password">
    <div class="err" id="aerr"></div>
    <button class="btn" id="go">Log in</button>
    <button id="sw" style="width:100%;padding:10px;background:none;color:var(--mute)">New here? Create an account</button>
    <button class="btn alt" id="anon">Continue as guest (anonymous)</button>
    <button class="btn alt" id="g">Continue with Google</button>
    <button class="btn hide" id="inst">Install app on this phone</button>
    <button class="btn alt" id="apk">Download Android app (APK)</button>
    <p class="mute">Messages are end-to-end encrypted on your device. Other people only see your username. One account per email address. A guest account lives only on this phone.</p>
  </div>
</div>

<div id="onb" class="screen center hide">
  <div class="sheet"><h3>Create your profile</h3>
    <input id="dn" placeholder="Display name"><input id="un" placeholder="Username (letters, numbers, _)" autocapitalize="none">
    <div class="err" id="oerr"></div><button class="btn" id="onbgo">Start chatting</button><button class="btn alt" id="onbout">Cancel</button></div>
</div>

<div id="main" class="screen hide">
  <header><strong id="ttl">Chats</strong><button class="icon" id="add" data-i="plus" aria-label="New chat"></button><button class="icon" id="mm" data-i="dots" aria-label="Menu"></button></header>
  <div class="body" id="tab"></div>
  <div class="tabs">
    <button data-t="chats" class="on"><span data-i="chat"></span>Chats</button>
    <button data-t="near"><span data-i="bt"></span>Bluetooth</button>
    <button data-t="meet"><span data-i="video"></span>Calls</button>
    <button data-t="set"><span data-i="gear"></span>Settings</button>
  </div>
</div>

<div id="chat" class="screen hide">
  <header><button class="icon" id="back" data-i="back" aria-label="Back"></button><div id="cav"></div><strong><span id="cn"></span><small id="cs"></small></strong>
    <button class="icon" id="vc" data-i="video" aria-label="Video call"></button><button class="icon" id="ac" data-i="phone" aria-label="Voice call"></button><button class="icon" id="cm" data-i="dots" aria-label="Menu"></button></header>
  <div id="sq" class="hide"><input id="sqi" placeholder="Search in chat"><button id="sqx" data-i="x" aria-label="Close search"></button></div>
  <div id="msgs"></div>
  <div id="chips" class="hide"></div>
  <div id="rpl" class="hide"><div id="rtx"></div><button id="rx" data-i="x" aria-label="Cancel reply"></button></div>
  <form id="f"><button type="button" class="plain" id="att" data-i="clip" aria-label="Attach"></button><button type="button" class="plain" id="stk" data-i="smile" aria-label="Stickers"></button>
    <input id="txt" placeholder="Type a message" autocomplete="off" spellcheck="false" autocapitalize="none">
    <button type="button" class="rb" id="mic" data-i="mic" aria-label="Voice message"></button><button class="rb hide" id="sb" data-i="send" aria-label="Send"></button></form>
</div>

<div id="lock" class="menu hide"><div class="sheet"><h3>App locked</h3><input id="lpin" type="password" inputmode="numeric" placeholder="Enter PIN"><button class="btn" id="lgo">Unlock</button><div class="err" id="lerr"></div></div></div>
<div id="call" class="hide" style="position:fixed;inset:0;z-index:70;background:#0b1512;color:#fff;flex-direction:column">
  <video id="rv" autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
  <div style="position:relative;z-index:1;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 0"><b id="cnm" style="font-size:1.2rem"></b><div id="cst" style="opacity:.85;font-size:.9rem"></div></div>
  <div id="cinfo" style="position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center"><div id="cav2"></div></div>
  <video id="lv" autoplay muted playsinline class="hide" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:96px;height:128px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.4);z-index:2"></video>
  <div style="position:relative;z-index:2;display:flex;justify-content:center;gap:18px;padding:20px 0 calc(30px + env(safe-area-inset-bottom,0px))">
    <button class="rb" id="kmute" data-i="mic" aria-label="Mute" style="background:rgba(255,255,255,.2)"></button>
    <button class="rb hide" id="kcam" data-i="video" aria-label="Camera" style="background:rgba(255,255,255,.2)"></button>
    <button class="rb" id="kend" data-i="phone" aria-label="End call" style="background:var(--red)"></button>
  </div>
</div>
<div id="inc" class="menu hide" style="z-index:80;align-items:center;justify-content:center;background:linear-gradient(170deg,#0b2f2a,#0f5c4d)">
  <div style="text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px"><div id="inca"></div><h2 id="incn" style="margin:6px 0 0"></h2><div id="inck" style="opacity:.85"></div>
    <div style="display:flex;gap:44px;margin-top:40px"><button class="rb" id="incn2" data-i="phone" aria-label="Decline" style="background:var(--red);width:68px;height:68px"></button><button class="rb" id="incy" data-i="phone" aria-label="Accept" style="width:68px;height:68px"></button></div></div>
</div>
<input type="file" id="pick" accept="image/*" class="hide">
<div id="menu" class="menu hide"><div class="sheetb" id="mbox"></div></div>
<div id="toast" class="hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    opt(b, 'Disappearing messages: ' + (DN[c.dis || 0] || 'Custom'), () => sheet('Disappearing messages', w => { w.append(mk('div', 'mute', 'New messages are removed after this time, for everyone in the chat.')); [['Off', 0], ['1 minute', 60], ['1 hour', 3600], ['24 hours', 86400]].forEach(d => opt(w, d[0], () => db.collection('chats').doc(c.id).update({dis:d[1]}).then(() => { c.dis = d[1]; closeSheet(); }).catch(e => toast(e.message)))); }));
    opt(b, P.mute.includes(c.id) ? 'Unmute' : 'Mute', () => { P.mute = P.mute.includes(c.id) ? P.mute.filter(x => x !== c.id) : [...P.mute, c.id]; saveP(); closeSheet(); });
    opt(b, P.pin.includes(c.id) ? 'Unpin chat' : 'Pin chat to top', () => { P.pin = P.pin.includes(c.id) ? P.pin.filter(x => x !== c.id) : [...P.pin, c.id]; saveP(); closeSheet(); });
    opt(b, P.arch.includes(c.id) ? 'Unarchive' : 'Archive', () => { P.arch = P.arch.includes(c.id) ? P.arch.filter(x => x !== c.id) : [...P.arch, c.id]; saveP(); closeSheet(); $('back').click(); });
    opt(b, 'Starred messages', () => sheet('Starred messages', w => { const l = fold().filter(it => P.star.includes(it.id) && it.p); if (!l.length) w.append(mk('div', 'mute', 'No starred messages in this chat.')); l.forEach(it => w.append(mk('div', 'opt', it.p.k === 'text' ? it.p.v : PRE[it.p.k] || 'Message'))); }));
    opt(b, 'Wallpaper', () => sheet('Chat wallpaper', w => {
      opt(w, 'Choose from gallery', () => pick('wall'));
      [['Sand', '#efe6d2'], ['Sky', '#dbeafe'], ['Rose', '#fde2e4'], ['Mint', '#d9f2e6'], ['Night', '#101820']].forEach(x => opt(w, x[0], async () => { await kset('wall:' + c.id, {color:x[1]}); applyWall(); closeSheet(); }));
      opt(w, 'Default wallpaper', async () => { await kset('wall:' + c.id, {}); applyWall(); closeSheet(); });
    }));
    if (c.group) opt(b, 'Group members', () => sheet('Members', w => c.members.forEach(u => w.append(mk('div', 'opt', (names[u] || 'Member') + (u === c.creator ? ' (admin)' : '') + (u === me.uid ? ' (you)' : ''))))));
    else {
      opt(b, 'Safety number', async () => { const n = c.peer.pub ? await safety(c.peer) : 'Not available'; sheet('Safety number', w => w.append(mk('div', 'mute', 'Compare this number with ' + c.peer.name + ' in person or on a call. If it matches, no one is in the middle.'), mk('h3', '', n))); });
      opt(b, S.blocked ? 'Unblock' : 'Block', async () => { const r = db.collection('users').doc(me.uid).collection('blocked').doc(c.peer.uid); try { if (S.blocked) await r.delete(); else await r.set({t:TS()}); S.blocked = !S.blocked; $('cs').textContent = S.blocked ? 'Blocked' : 'End-to-end encrypted'; closeSheet(); } catch (e) { toast(e.message); } }, 'danger');
    }
  });
};
async function applyWall() { const w = (await kget('wall:' + S.chat.id)) || {}, s = $('msgs').style; if (w.img) { s.backgroundImage = 'linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)), url("' + w.img + '")'; s.backgroundSize = 'cover'; s.backgroundPosition = 'center'; s.backgroundColor = ''; } else { s.backgroundImage = ''; s.backgroundSize = ''; s.backgroundPosition = ''; s.backgroundColor = w.color || ''; } }

// ---------- fun: effects, XP, badges ----------
function burst(list) { if (matchMedia('(prefers-reduced-motion:reduce)').matches) return; for (let i = 0; i < 28; i++) { const e = mk('div', 'fx', list[i % list.length]); e.style.left = Math.random() * 100 + 'vw'; e.style.animationDelay = Math.random() * 0.8 + 's'; e.style.fontSize = (1 + Math.random()) + 'rem'; document.body.append(e); setTimeout(() => e.remove(), 3600); } }
function gain(p) {
  const before = Math.floor(P.xp / 50); P.xp += ({text:2, voice:5, img:4, poll:6, loc:4})[p.k] || 2;
  const b = p.bomb ? 'Bomber' : p.fx ? 'Showman' : ({voice:'Voice Star', poll:'Pollster', img:'Photographer', loc:'Explorer'})[p.k];
  if (b && !P.badges[b]) { P.badges[b] = 1; toast('Badge unlocked: ' + b); burst(['\uD83C\uDFC6', '\u2728']); }
  if (Math.floor(P.xp / 50) > before) { toast('Level up! You are now level ' + (before + 2)); burst(['\uD83C\uDF89', '\u2B50']); } saveP();
}

// ---------- settings ----------
function settings(box) {
  const p = mk('div', 'card'), av = avatar(me, 90); av.style.margin = '0 auto 10px'; av.style.cursor = 'pointer'; av.onclick = () => pick('dp');
  const nm = mk('input'), ab = mk('input'), sv = mk('button', 'btn', 'Save profile'); nm.value = me.name; ab.value = me.about || '';
  sv.onclick = () => db.collection('users').doc(me.uid).update({name:nm.value.trim() || me.name, about:ab.value, photo:me.photo || ''}).then(() => { me.name = nm.value.trim() || me.name; me.about = ab.value; toast('Saved'); }).catch(e => toast(e.message));
  p.append(av, mk('div', 'mute', 'Tap the picture to change it. Your username: @' + me.username), nm, ab, sv);
  const lv = mk('div', 'card'), xb = mk('div', 'xpbar'), xf = mk('i'); xf.style.width = (P.xp % 50) * 2 + '%'; xb.append(xf); lv.append(mk('h3', '', 'Level ' + (Math.floor(P.xp / 50) + 1) + ' | ' + P.xp + ' XP'), xb, mk('div', 'mute', 'Badges: ' + (Object.keys(P.badges).join(', ') || 'none yet')));
  const ap = mk('div', 'card'); ap.append(mk('h3', '', 'Appearance'));
  [['Auto', ''], ['Light', 'light'], ['Dark', 'dark']].forEach(t => opt(ap, (P.theme === t[1] ? '\u2713 ' : '') + 'Theme: ' + t[0], () => { P.theme = t[1]; saveP(); look(); render(); }));
  Object.keys(ACC).forEach(a => opt(ap, (P.acc === a ? '\u2713 ' : '') + 'Accent: ' + a, () => { P.acc = a; saveP(); look(); render(); }));
  Object.keys(FS).forEach(f => opt(ap, (P.fs === f ? '\u2713 ' : '') + 'Text size: ' + f, () => { P.fs = f; saveP(); look(); render(); }));
  const pv = mk('div', 'card'); pv.append(mk('h3', '', 'Privacy and security'), mk('div', 'mute', 'End-to-end encrypted. No ads, trackers or analytics. Screen blurs when you leave the app.'));
  opt(pv, 'Read receipts: ' + (P.rr ? 'On' : 'Off'), () => { P.rr = !P.rr; saveP(); render(); });
  opt(pv, 'App lock: ' + (P.lock ? 'On (tap to turn off)' : 'Off (tap to set a PIN)'), () => { if (P.lock) { P.lock = ''; saveP(); render(); return; } sheet('Set a 4-digit PIN', w => { const i = mk('input'), s = mk('button', 'btn', 'Save PIN'); i.type = 'password'; i.inputMode = 'numeric'; i.maxLength = 4; s.onclick = async () => { if (/^\d{4}$/.test(i.value)) { P.lock = await sha(i.value); saveP(); closeSheet(); render(); } }; w.append(i, s); }); });
  if (P.lock) opt(pv, 'Lock now', () => $('lock').classList.remove('hide'));
  opt(pv, 'Panic wipe: erase keys from this device', () => sheet('Erase keys?', w => { w.append(mk('div', 'mute', 'Your encryption keys and settings are deleted from this device and you are logged out. Old messages can no longer be read here.')); opt(w, 'Yes, wipe now', async () => { await kclear(); try { localStorage.clear(); } catch (e) {} await auth.signOut(); location.reload(); }, 'danger'); }), 'danger');
  const inv = mk('div', 'card'), link = location.origin + location.pathname + '?add=' + me.username; inv.append(mk('h3', '', 'Invite friends'));
  opt(inv, 'Share my invite link', () => { if (navigator.share) navigator.share({title:'Zylo', text:'Chat with me on Zylo', url:link}).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Link copied')); });
  opt(inv, 'Share on WhatsApp', () => window.open('https://wa.me/?text=' + encodeURIComponent('Chat with me on Zylo: ' + link), '_blank', 'noopener'));
  if (!matchMedia('(display-mode: standalone)').matches) opt(inv, 'Install app on this phone', installApp);
  opt(inv, 'Download Android app (APK)', getApk);
  const bl = mk('div', 'card'); bl.append(mk('h3', '', 'Blocked people')); const bs = mk('div'); bl.append(bs);
  db.collection('users').doc(me.uid).collection('blocked').get().then(async snap => { if (snap.empty) bs.append(mk('div', 'mute', 'No one is blocked.')); for (const d of snap.docs) { const pr = await getPeer(d.id); opt(bs, 'Unblock ' + pr.name, () => d.ref.delete().then(render)); } });
  const ac = mk('div', 'card'); ac.append(mk('h3', '', 'Account'), mk('div', 'mute', auth.currentUser.email || 'Guest (anonymous). If you log out or clear this app\u2019s data, this account cannot be recovered.')); opt(ac, 'Log out', () => auth.signOut());
  opt(ac, 'Delete my account', () => sheet('Delete account?', w => { w.append(mk('div', 'mute', 'Your profile and username are deleted. Your chat history stays with the other people, but they can no longer reach you.')); opt(w, 'Yes, delete my account', delAcc, 'danger'); }), 'danger');
  box.append(p, lv, ap, pv, inv, bl, ac);
}
async function delAcc() {
  const u = auth.currentUser;
  try {
    if (!u.isAnonymous) {
      if (u.providerData.some(p => p.providerId === 'password')) { const pw = await askPw(); await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pw)); }
      else await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
    }
    await db.collection('usernames').doc(me.username).delete(); if (u.email) await db.collection('emails').doc(gkey(u.email)).delete().catch(() => {});
    await db.collection('users').doc(me.uid).delete(); await u.delete(); await kclear(); try { localStorage.clear(); } catch (e) {} location.reload();
  } catch (e) { toast(authErr(e)); }
}
const askPw = () => new Promise(res => sheet('Confirm your password', w => { const i = mk('input'), b = mk('button', 'btn', 'Confirm'); i.type = 'password'; i.placeholder = 'Password'; b.onclick = () => { closeSheet(); res(i.value); }; w.append(i, b); }));

// ---------- install on Android (PWA) ----------
let dip = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; $('inst').classList.remove('hide'); });
addEventListener('appinstalled', () => { dip = null; $('inst').classList.add('hide'); toast('Zylo installed'); });
function installApp() {
  if (dip) { dip.prompt(); dip.userChoice.finally(() => { dip = null; $('inst').classList.add('hide'); }); return; }
  sheet('Install Zylo', w => w.append(mk('div', 'mute', 'In Chrome, tap the three dots at the top right, then tap "Install app" (or "Add to Home screen"), then tap Install. The app will appear on your home screen like any other app.')));
}
$('inst').onclick = installApp; $('apk').onclick = getApk;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- app lock and privacy blur ----------
const sha = async s => toB(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mc:' + s))));
$('lgo').onclick = async () => { if (await sha($('lpin').value) === P.lock) { $('lock').classList.add('hide'); $('lpin').value = ''; $('lerr').textContent = ''; } else $('lerr').textContent = 'Wrong PIN'; };
document.addEventListener('visibilitychange', () => { document.body.style.filter = document.hidden ? 'blur(18px)' : ''; if (document.hidden && P.lock) $('lock').classList.remove('hide'); });
if (P.lock) $('lock').classList.remove('hide');
</script>
